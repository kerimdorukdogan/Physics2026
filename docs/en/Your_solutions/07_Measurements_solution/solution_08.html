<!DOCTYPE html>
<html>
<head>
    <title>Mass-Spring Measurements</title>
</head>
<body>
    <h1>Mass-Spring Measurements</h1>

    <p>
        This simulator is used to measure the period of a mass-spring oscillator.
        We take 10 measurements, calculate the mean period, standard deviation,
        and then calculate the spring constant.
    </p>

    <h2>Given</h2>

    <label>Mass m (kg):</label>
    <input id="mass" type="number" value="1" step="0.1">

    <br><br>

    <label>Time for 10 oscillations (seconds):</label>
    <input id="time" type="number" step="0.01">

    <button onclick="addMeasurement()">Add measurement</button>

    <h2>Measurements</h2>
    <ul id="list"></ul>

    <h2>Results</h2>
    <p id="mean"></p>
    <p id="std"></p>
    <p id="spring"></p>

    <script>
        let periods = [];

        function addMeasurement() {
            let time = Number(document.getElementById("time").value);
            let mass = Number(document.getElementById("mass").value);

            if (time <= 0 || mass <= 0) {
                alert("Please enter positive values.");
                return;
            }

            let period = time / 10;
            periods.push(period);

            let list = document.getElementById("list");
            let item = document.createElement("li");
            item.innerText = "Time = " + time + " s, Period = " + period.toFixed(3) + " s";
            list.appendChild(item);

            calculate(mass);
        }

        function calculate(mass) {
            let n = periods.length;

            let sum = 0;
            for (let i = 0; i < n; i++) {
                sum += periods[i];
            }

            let mean = sum / n;

            let varianceSum = 0;
            for (let i = 0; i < n; i++) {
                varianceSum += Math.pow(periods[i] - mean, 2);
            }

            let std = 0;
            if (n > 1) {
                std = Math.sqrt(varianceSum / (n - 1));
            }

            let k = (4 * Math.PI * Math.PI * mass) / (mean * mean);

            document.getElementById("mean").innerText =
                "Mean period = " + mean.toFixed(3) + " s";

            document.getElementById("std").innerText =
                "Standard deviation = " + std.toFixed(3) + " s";

            document.getElementById("spring").innerText =
                "Spring constant k = " + k.toFixed(3) + " N/m";
        }
    </script>
</body>
</html>
